name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run backend tests
        run: npm test
      
      - name: Run frontend tests
        run: npm run test:frontend
        if: hashFiles('frontend/**') != ''
      
      - name: Run integration tests
        run: npm run test:integration
      
      - name: Lint code
        run: npm run lint
      
      - name: Type check backend
        run: npm run type-check
      
      - name: Type check frontend
        run: npm run type-check:frontend
        if: hashFiles('frontend/**') != ''

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build backend
        run: npm run build
      
      - name: Build frontend
        run: npm run build:frontend
        if: hashFiles('frontend/**') != ''
      
      - name: Security scan
        run: npm audit --audit-level=moderate
      
      - name: Build Docker image
        run: docker build -t ecommerce-app .
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push Docker image
        run: |
          docker tag ecommerce-app ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to Render
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}' \
            ${{ secrets.RENDER_DEPLOY_HOOK }}
      
      - name: Run database migrations
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"command":"npx prisma migrate deploy"}' \
            ${{ secrets.RENDER_MIGRATION_HOOK }}
      
      - name: Health check
        run: |
          sleep 30
          curl -f ${{ secrets.APP_URL }}/health || exit 1
      
      - name: Notify success
        if: success()
        run: echo "Deploy successful"
      
      - name: Notify failure
        if: failure()
        run: echo "Deploy failed"
