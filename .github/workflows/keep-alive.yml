name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *' # A cada 10 minutos
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping health endpoint
        run: |
          curl -f ${{ secrets.APP_URL }}/health || exit 1
      
      - name: Log result
        if: success()
        run: echo "Keep-alive ping successful"
      
      - name: Log failure
        if: failure()
        run: echo "Keep-alive ping failed"
